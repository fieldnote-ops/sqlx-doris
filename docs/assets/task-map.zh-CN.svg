                <text x="670" y="153" class="micro" >应用运行期</text>
                <text x="630" y="178" class="node-title" >批量导入</text>
                <text x="630" y="201" class="mono" >StreamLoadClient → LoadReceipt</text>
                <path d="M630 214H1150" class="rule"/>
                <text x="630" y="232" class="mono accent" >stream-load</text>
                <text x="1142" y="179" class="node-title accent" >↗</text>
            </g><g data-task="checked" role="button" tabindex="0" aria-label="编译期检查 SQL" class="">
                <rect x="32" y="260" width="556" height="111" rx="10" class="raised"/>
                <rect x="32" y="257" width="556" height="111" rx="10" class="panel"/>
                <text x="50" y="280" class="number" >03</text>
                <text x="90" y="280" class="micro" >开发与交付</text>
                <text x="50" y="305" class="node-title" >编译期检查 SQL</text>
                <text x="50" y="328" class="mono" >sqlx_doris::query!</text>
                <path d="M50 341H570" class="rule"/>
                <text x="50" y="359" class="mono accent" >macros</text>
                <text x="562" y="306" class="node-title accent" >↗</text>
            </g><g data-task="migrate" role="button" tabindex="0" aria-label="交付结构变更" class="">
                <rect x="612" y="260" width="556" height="111" rx="10" class="raised"/>
                <rect x="612" y="257" width="556" height="111" rx="10" class="panel"/>
                <text x="630" y="280" class="number" >04</text>
                <text x="670" y="280" class="micro" >开发与交付</text>
                <text x="630" y="305" class="node-title" >交付结构变更</text>
                <text x="630" y="328" class="mono" >sqlx::migrate! / Migrator</text>
                <path d="M630 341H1150" class="rule"/>
                <text x="630" y="359" class="mono accent" >migrate</text>
                <text x="1142" y="306" class="node-title accent" >↗</text>
            </g><g data-task="helpers" role="button" tabindex="0" aria-label="使用 Doris 助手" class="">
                <rect x="32" y="387" width="556" height="111" rx="10" class="raised"/>
                <rect x="32" y="384" width="556" height="111" rx="10" class="panel"/>
                <text x="50" y="407" class="number" >05</text>
                <text x="90" y="407" class="micro" >应用运行期</text>
                <text x="50" y="432" class="node-title" >使用 Doris 助手</text>
                <text x="50" y="455" class="mono" >sqlx_doris::operations</text>
                <path d="M50 468H570" class="rule"/>
                <text x="50" y="486" class="mono accent" >operations</text>
                <text x="562" y="433" class="node-title accent" >↗</text>
            </g><g data-task="diagnose" role="button" tabindex="0" aria-label="诊断异常" class="">
                <rect x="612" y="387" width="556" height="111" rx="10" class="raised"/>
                <rect x="612" y="384" width="556" height="111" rx="10" class="panel"/>
                <text x="630" y="407" class="number" >06</text>
                <text x="670" y="407" class="micro" >专项运维</text>
                <text x="630" y="432" class="node-title" >诊断异常</text>
