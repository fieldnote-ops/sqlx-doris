                <path d="M630 468H1150" class="rule"/>
                <text x="630" y="486" class="mono accent" >cli-admin</text>
                <text x="1142" y="433" class="node-title accent" >↗</text>
            </g><text x="32" y="522" class="small" >这里列出 Doris 特性；上游 SQLx 特性仍需显式选择，详见任务说明与指南。</text>
        </svg>
