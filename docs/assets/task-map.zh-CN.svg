                <text x="50" y="178" class="node-title" >查询与流式读取</text>
                <text x="50" y="201" class="mono" >sqlx::query* + DorisPool</text>
                <path d="M50 214H570" class="rule"/>
                <text x="50" y="232" class="mono accent" >无需特性 / default=[]</text>
                <text x="562" y="179" class="node-title accent" >↗</text>
            </g><g data-task="ingest" role="button" tabindex="0" aria-label="批量导入" class="">
