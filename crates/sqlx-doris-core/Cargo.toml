[package]
name = "sqlx-doris-core"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Standalone Apache Doris driver for SQLx"
readme = "README.md"
repository.workspace = true
keywords = ["sqlx", "doris", "database", "async"]
categories = ["database"]
include = ["src/**", "README.md", "README.zh-CN.md", "LICENSE", "Cargo.toml"]

[features]
default = []
macro-support = ["dep:sqlx-macros-core", "bitflags/serde"]
migrate = ["sqlx-core/migrate", "dep:uuid"]
value-support = []

[dependencies]
sqlx-macros-core = { version = "=0.9.0", default-features = false, features = ["macros", "_rt-tokio", "chrono", "bigdecimal", "json"], optional = true }
sqlx-core.workspace = true
bytes = "1"
bitflags = "2"
futures-core = "0.3"
futures-util = "0.3"
async-stream = "0.3"
url = "2"
percent-encoding = "2"
sha1 = "0.10"
log = "0.4"
tokio.workspace = true
bigdecimal.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid = { version = "1", features = ["v4"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
