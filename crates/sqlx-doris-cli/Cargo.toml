[package]
name = "sqlx-doris-cli"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line implementation for sqlx-doris"
readme = "README.md"
include = ["src/**", "README.md", "README.zh-CN.md", "LICENSE", "Cargo.toml"]

[features]
default = []
admin = ["sqlx-doris-ops/maintenance"]
kafka-admin = ["admin", "sqlx-doris-ops/kafka"]

[dependencies]
sqlx-doris-core = { path = "../sqlx-doris-core", version = "=0.2.0", features = ["migrate"] }
sqlx-doris-ops = { path = "../sqlx-doris-ops", version = "=0.2.0", default-features = false, features = ["cli-support"] }
sqlx-core.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json.workspace = true
clap = { version = "4", features = ["derive", "env"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
