[package]
name = "sqlx-doris"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Standalone Apache Doris driver for SQLx"
readme = "README.md"
repository.workspace = true
keywords = ["sqlx", "doris", "database", "async"]
categories = ["database"]
include = [
    "src/**",
    "examples/**",
    "tests/**",
    "README.md",
    "README.zh-CN.md",
    "LICENSE",
    "Cargo.toml",
    "Cargo.lock",
]

[features]
default = []
macros = ["dep:sqlx-doris-macros", "sqlx-doris-macros/query"]
migrate = ["sqlx-doris-core/migrate"]
cli = ["migrate", "dep:sqlx-doris-cli"]
cli-admin = ["cli", "sqlx-doris-cli/admin"]
cli-admin-kafka = ["cli-admin", "sqlx-doris-cli/kafka-admin"]
operations = ["dep:sqlx-doris-ops", "sqlx-doris-ops/helpers"]
stream-load = ["operations", "sqlx-doris-ops/stream-load"]

[[bin]]
name = "cargo-sqlx-doris"
path = "src/bin/cargo-sqlx-doris.rs"
required-features = ["cli"]

[[example]]
name = "stream_load"
required-features = ["stream-load"]

[dependencies]
sqlx-doris-ops = { path = "../sqlx-doris-ops", version = "=0.2.0", default-features = false, optional = true }
sqlx-doris-core = { path = "../sqlx-doris-core", version = "=0.2.0" }
sqlx-doris-macros = { path = "../sqlx-doris-macros", version = "=0.2.0", default-features = false, optional = true }
sqlx-doris-cli = { path = "../sqlx-doris-cli", version = "=0.2.0", default-features = false, optional = true }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
sqlx = { workspace = true, features = ["migrate"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json.workspace = true
futures-util = "0.3"
bigdecimal.workspace = true
chrono.workspace = true
serde.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }

[[example]]
name = "native_types"
required-features = ["operations"]

[[example]]
name = "benchmark"
required-features = ["operations"]

[[example]]
name = "benchmark_workloads"
required-features = ["stream-load"]

[[test]]
name = "auth_tls_live"
required-features = ["operations"]

[[test]]
name = "complex_bindings"
required-features = ["operations"]

[[test]]
name = "materialized_view_live"
required-features = ["operations"]

[[test]]
name = "operations_live"
required-features = ["operations"]

[[test]]
name = "schema_live"
required-features = ["operations"]

[[test]]
name = "types_extended"
required-features = ["operations"]
