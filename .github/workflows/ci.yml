name: Documentation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# Hosted runners have no external volume, so this workflow only runs checks
# that never create build products: guide/link/anchor validation and
# formatting. Builds, tests, packaging and live contracts require an external
# volume and run through ./scripts/dev on a self-hosted runner; see Verify.
jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SQLX_DORIS_DEV_ACTIVE: "1"
      SQLX_DORIS_ARTIFACTS_DIR: ${{ runner.temp }}/artifacts
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Bilingual guides, links and anchors
        run: python -B scripts/check-docs
      - name: Install the formatting pins
        run: python -m pip install --disable-pip-version-check black==25.9.0
      - name: Rust and Python formatting
        run: python -B scripts/format --check
