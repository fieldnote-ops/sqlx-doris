[package]
name = "sqlx-doris-upstream-regression"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace]
resolver = "3"

[features]
default = ["official-baseline"]
official-baseline = []

[[test]]
name = "mysql_regression"
path = "../mysql-regression/tests/mysql_regression.rs"

[dependencies]
sqlx = { version = "=0.9.0", default-features = false, features = ["mysql", "runtime-tokio", "tls-rustls-aws-lc-rs", "json", "bigdecimal", "chrono", "derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util", "fs", "sync"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
chrono = { version = "0.4", features = ["serde"] }
bigdecimal = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
