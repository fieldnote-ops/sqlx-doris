[workspace]
members = [
    "crates/sqlx-doris",
    "crates/sqlx-doris-core",
    "crates/sqlx-doris-macros",
    "crates/sqlx-doris-ops",
    "crates/sqlx-doris-cli",
]
default-members = ["crates/sqlx-doris"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/fieldnote-ops/sqlx-doris"

[workspace.dependencies]
bigdecimal = { version = "0.4", features = ["serde"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit-mut"] }
# SQLx 0.9 gates the required Executor::describe method behind offline.
# Keep the trait surface consistent when applications enable upstream macros.
sqlx-core = { version = "=0.9.0", default-features = false, features = ["_rt-tokio", "_tls-rustls-aws-lc-rs", "json", "bigdecimal", "chrono", "offline"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["derive"] }
tokio = { version = "1", features = ["time", "net", "io-util", "fs"] }
