[workspace]
members = ["crates/sqlx-doris", "crates/sqlx-mysql", "tests/protocol", "tests/mysql-regression"]
default-members = ["crates/sqlx-doris"]
resolver = "3"
exclude = ["tests/mysql-upstream"]

# The SDK carries the driver as a path dependency, so applications need no patch.
# This entry only keeps this workspace's own SQLx-based tests and macro examples on
# the same native MySql package.
[patch.crates-io]
sqlx-mysql = { path = "crates/sqlx-mysql" }

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/fieldnote-ops/sqlx-doris"
homepage = "https://github.com/fieldnote-ops/sqlx-doris"

[workspace.dependencies]
bigdecimal = { version = "0.4", features = ["serde"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"

[workspace.dependencies.sqlx-core]
version = "=0.9.0"
default-features = false
features = [
    "_rt-tokio",
    "_tls-rustls-aws-lc-rs",
    "json",
    "bigdecimal",
    "chrono",
    "migrate",
]

[workspace.dependencies.sqlx]
version = "=0.9.0"
default-features = false
features = [
    "mysql",
    "runtime-tokio",
    "tls-rustls-aws-lc-rs",
    "json",
    "bigdecimal",
    "chrono",
    "derive",
]

[workspace.dependencies.tokio]
version = "1"
features = [
    "macros",
    "rt-multi-thread",
    "time",
    "net",
    "io-util",
    "fs",
]
